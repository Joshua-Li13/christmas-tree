<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>🎄 Merry Christmas</title>
  <style>
    :root{
      --bg1:#05080f;
      --bg2:#081a2a;
      --txt:#e8f0ff;
      --accent:#7cffb2;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
      color:var(--txt);
      background: radial-gradient(1200px 800px at 50% 35%, #0d2a43 0%, var(--bg2) 35%, var(--bg1) 100%);
      overflow:hidden;
    }
    .wrap{
      position:relative;
      height:100%;
      display:grid;
      place-items:center;
      padding:24px 16px 28px;
    }
    .card{
      width:min(520px, 92vw);
      border-radius:24px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding:18px 16px 16px;
      position:relative;
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:2px 6px 12px;
    }
    header .title{
      font-weight:700;
      letter-spacing:.5px;
    }
    header .sub{
      opacity:.75;
      font-size:12px;
      margin-top:2px;
    }
    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color:var(--txt);
      padding:10px 12px;
      border-radius:14px;
      font-weight:600;
      cursor:pointer;
      transition:.2s transform, .2s background;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{transform:scale(.98)}
    .btn:hover{background: rgba(255,255,255,.10)}
    .stage{
      width:100%;
      border-radius:18px;
      overflow:hidden;
      background: radial-gradient(600px 320px at 50% 20%, rgba(124,255,178,.12) 0%, rgba(255,255,255,0) 60%),
                  linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.08));
      border:1px solid rgba(255,255,255,.08);
      position:relative;
      aspect-ratio: 3/4;
      min-height: 420px;
    }
    canvas{width:100%;height:100%;display:block}
    .hint{
      text-align:center;
      font-size:12px;
      opacity:.75;
      padding-top:10px;
    }
    .badge{
      position:absolute;
      left:14px; bottom:14px;
      font-size:12px;
      padding:8px 10px;
      border-radius:999px;
      background: rgba(0,0,0,.22);
      border:1px solid rgba(255,255,255,.14);
      display:flex;
      gap:8px;
      align-items:center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .dot{
      width:8px;height:8px;border-radius:50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(124,255,178,.9);
      animation:pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.2);opacity:1}}
    .footer{
      margin-top:10px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      padding:0 2px;
      opacity:.85;
      font-size:12px;
    }
    a{color:#bfe3ff;text-decoration:none;border-bottom:1px dashed rgba(191,227,255,.5)}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <header>
        <div>
          <div class="title">🎄 圣诞树特效</div>
          <div class="sub">闪灯 + 雪花 + 星光（微信可直接打开）</div>
        </div>
        <button class="btn" id="toggle">暂停</button>
      </header>

      <div class="stage">
        <canvas id="c"></canvas>
        <div class="badge"><span class="dot"></span><span id="status">运行中</span></div>
      </div>

      <div class="hint">提示：点“暂停”可停动画；在手机上默认自适应全屏比例。</div>
      <div class="footer">
        <span>单文件部署：GitHub Pages / Vercel</span>
        <span>需要 <b>https</b> 链接</span>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('toggle');
  const statusEl = document.getElementById('status');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const rect = canvas.getBoundingClientRect();
    W = Math.floor(rect.width * DPR);
    H = Math.floor(rect.height * DPR);
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resize, {passive:true});
  resize();

  // helpers
  const rand = (a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  // Snow particles
  const snow = Array.from({length: 140}, () => ({
    x: Math.random(), y: Math.random(),
    r: rand(0.6, 2.2),
    v: rand(0.12, 0.65),
    drift: rand(-0.25, 0.25),
    a: rand(0.25, 0.9)
  }));

  // Tree geometry (normalized)
  function treePoint(level, t){
    // level 0..1 from top to bottom
    // t is horizontal factor -1..1
    // cone-ish width grows with level
    const w = 0.06 + 0.38 * Math.pow(level, 1.15);
    return { x: 0.5 + t*w, y: 0.15 + 0.70*level };
  }

  // Lights on tree
  const lights = [];
  const lightCount = 90;
  for(let i=0;i<lightCount;i++){
    const level = Math.pow(Math.random(), 0.65); // bias lower
    const t = rand(-1, 1) * (0.6 + 0.4*Math.random());
    const p = treePoint(level, t);
    lights.push({
      u:p.x, v:p.y,
      phase: rand(0, Math.PI*2),
      size: rand(1.6, 3.4),
      hue: rand(0, 360),
      sparkle: rand(0.2, 1.0)
    });
  }

  // Ornaments (bigger balls)
  const ornaments = [];
  const orbCount = 14;
  for(let i=0;i<orbCount;i++){
    const level = rand(0.2, 0.98);
    const t = rand(-1, 1) * 0.95;
    const p = treePoint(level, t);
    ornaments.push({
      u:p.x, v:p.y,
      r: rand(5, 10),
      hue: rand(0, 360),
      shine: rand(0.5, 1.0)
    });
  }

  // Star
  function drawStar(cx, cy, spikes, outerR, innerR, rot){
    let x = cx, y = cy;
    let step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for(let i=0;i<spikes;i++){
      x = cx + Math.cos(rot + i*2*step) * outerR;
      y = cy + Math.sin(rot + i*2*step) * outerR;
      ctx.lineTo(x,y);
      x = cx + Math.cos(rot + (i*2+1)*step) * innerR;
      y = cy + Math.sin(rot + (i*2+1)*step) * innerR;
      ctx.lineTo(x,y);
    }
    ctx.closePath();
  }

  // Ground
  function drawGround(){
    const y = H*0.87;
    const grd = ctx.createLinearGradient(0, y, 0, H);
    grd.addColorStop(0, "rgba(255,255,255,0.20)");
    grd.addColorStop(1, "rgba(255,255,255,0.02)");
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(W*0.5, y, W*0.45, H*0.10, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // Draw tree body
  function drawTreeBody(){
    const top = {x: W*0.5, y: H*0.16};
    const baseL = {x: W*0.18, y: H*0.84};
    const baseR = {x: W*0.82, y: H*0.84};

    // Glow behind tree
    const glow = ctx.createRadialGradient(W*0.5, H*0.42, 10, W*0.5, H*0.45, W*0.42);
    glow.addColorStop(0, "rgba(124,255,178,0.18)");
    glow.addColorStop(1, "rgba(124,255,178,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);

    // Tree gradient
    const g = ctx.createLinearGradient(0, H*0.2, 0, H*0.86);
    g.addColorStop(0, "rgba(30,180,110,0.95)");
    g.addColorStop(1, "rgba(7,80,48,0.98)");
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.moveTo(top.x, top.y);
    ctx.lineTo(baseL.x, baseL.y);
    ctx.lineTo(baseR.x, baseR.y);
    ctx.closePath();
    ctx.fill();

    // Layered "branches" stripes
    for(let i=0;i<10;i++){
      const level = i/10;
      const y = H*(0.22 + 0.60*level);
      const w = W*(0.12 + 0.62*Math.pow(level, 1.2));
      ctx.strokeStyle = `rgba(255,255,255,${0.06 - level*0.04})`;
      ctx.lineWidth = Math.max(1, 3*DPR*(1-level));
      ctx.beginPath();
      ctx.moveTo(W*0.5 - w/2, y);
      ctx.lineTo(W*0.5 + w/2, y);
      ctx.stroke();
    }

    // Trunk
    const trunkW = W*0.09;
    const trunkH = H*0.10;
    const tx = W*0.5 - trunkW/2;
    const ty = H*0.84;
    const tg = ctx.createLinearGradient(tx, ty, tx+trunkW, ty);
    tg.addColorStop(0, "rgba(90,55,25,0.9)");
    tg.addColorStop(1, "rgba(55,30,12,0.9)");
    ctx.fillStyle = tg;
    roundRect(tx, ty, trunkW, trunkH, 10*DPR);
    ctx.fill();
  }

  function roundRect(x,y,w,h,r){
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawStringLights(t){
    for(const L of lights){
      const x = L.u*W;
      const y = L.v*H;
      const twinkle = 0.55 + 0.45*Math.sin(t*2.2 + L.phase);
      const alpha = clamp(0.25 + twinkle*0.75*L.sparkle, 0, 1);

      // soft glow
      ctx.beginPath();
      ctx.fillStyle = `hsla(${L.hue}, 92%, 62%, ${alpha*0.22})`;
      ctx.arc(x, y, (L.size*6)*DPR, 0, Math.PI*2);
      ctx.fill();

      // core bulb
      ctx.beginPath();
      ctx.fillStyle = `hsla(${L.hue}, 95%, 70%, ${alpha})`;
      ctx.arc(x, y, (L.size*1.2)*DPR, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawOrnaments(t){
    for(const o of ornaments){
      const x = o.u*W, y = o.v*H;
      const bob = Math.sin(t*1.4 + o.hue)*0.6*DPR;
      const r = o.r*DPR;

      // shadow
      ctx.beginPath();
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.arc(x + 2*DPR, y + 3*DPR + bob, r*1.02, 0, Math.PI*2);
      ctx.fill();

      // ball
      const rg = ctx.createRadialGradient(x - r*0.35, y - r*0.35 + bob, r*0.2, x, y + bob, r);
      rg.addColorStop(0, `hsla(${o.hue}, 90%, 70%, 0.95)`);
      rg.addColorStop(1, `hsla(${o.hue}, 90%, 45%, 0.95)`);
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(x, y + bob, r, 0, Math.PI*2);
      ctx.fill();

      // highlight
      ctx.fillStyle = `rgba(255,255,255,${0.35*o.shine})`;
      ctx.beginPath();
      ctx.arc(x - r*0.25, y - r*0.25 + bob, r*0.35, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawStarTop(t){
    const cx = W*0.5, cy = H*0.13;
    const outer = 20*DPR;
    const inner = 9*DPR;
    const rot = t*0.7;

    // star glow
    const glow = ctx.createRadialGradient(cx, cy, 2, cx, cy, 95*DPR);
    glow.addColorStop(0, "rgba(255,230,140,0.35)");
    glow.addColorStop(1, "rgba(255,230,140,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0,0,W,H);

    drawStar(cx, cy, 5, outer, inner, rot);
    const sg = ctx.createLinearGradient(cx-outer, cy-outer, cx+outer, cy+outer);
    sg.addColorStop(0, "rgba(255,235,170,0.95)");
    sg.addColorStop(1, "rgba(255,180,90,0.95)");
    ctx.fillStyle = sg;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.25)";
    ctx.lineWidth = 1.5*DPR;
    ctx.stroke();
  }

  function drawSnow(){
    for(const s of snow){
      s.y += s.v / 320 * (H/DPR);
      s.x += s.drift / 600 * (W/DPR);
      if(s.y > 1.02){ s.y = -0.02; s.x = Math.random(); }
      if(s.x < -0.05) s.x = 1.05;
      if(s.x > 1.05) s.x = -0.05;

      const x = s.x*W, y = s.y*H;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.arc(x, y, s.r*DPR, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawText(t){
    const msg = "Merry Christmas";
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const y = H*0.93;
    const wobble = Math.sin(t*1.1)*2*DPR;

    ctx.font = `${Math.round(22*DPR)}px system-ui, -apple-system, "Segoe UI", Arial`;
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.shadowColor = "rgba(124,255,178,0.35)";
    ctx.shadowBlur = 16*DPR;
    ctx.fillText(msg, W*0.5, y + wobble);

    ctx.font = `${Math.round(12*DPR)}px system-ui, -apple-system, "Segoe UI", Arial`;
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.70)";
    ctx.fillText("🎁 点右上角可转发给朋友", W*0.5, y + 26*DPR);
    ctx.restore();
  }

  // Animation loop
  let running = true;
  let last = performance.now();

  function tick(now){
    const dt = Math.min(50, now - last);
    last = now;

    // time in seconds
    const t = now / 1000;

    ctx.clearRect(0,0,W,H);

    // subtle vignette
    ctx.fillStyle = "rgba(0,0,0,0.10)";
    ctx.fillRect(0,0,W,H);

    drawSnow();
    drawGround();
    drawTreeBody();
    drawStringLights(t);
    drawOrnaments(t);
    drawStarTop(t);
    drawText(t);

    if(running) requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  toggleBtn.addEventListener('click', () => {
    running = !running;
    toggleBtn.textContent = running ? "暂停" : "继续";
    statusEl.textContent = running ? "运行中" : "已暂停";
    if(running){
      last = performance.now();
      requestAnimationFrame(tick);
    }
  }, {passive:true});
})();
</script>
</body>
</html>
